name: build

on:
  push:
    branches: [ "mother" ]
  pull_request:
    branches: [ "mother" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Run Go tests
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Verify Podman Installation
        run: podman --version

      - name: Build Podman Image
        run: make pod-build
