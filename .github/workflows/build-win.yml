name: build-win

on:
  push:
    branches: ["mother"]
  pull_request:
    branches: ["mother"]

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes

      - name: Build Wails
        working-directory: .
        shell: bash
        run: |
          wails build \
            --platform windows/amd64 \
            -nsis \
            -o nephrite-win.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wails Build Windows nephrite-win.exe
          path: build/bin/*
          if-no-files-found: error
