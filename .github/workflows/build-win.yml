name: build-win

on:
  push:
    branches: ["mother"]
  pull_request:
    branches: ["mother"]

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          $makensis = Join-Path $nsisDir 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            Write-Error "makensis.exe not found at $makensis"
            exit 1
          }
          Write-Host "Found: $makensis"
          & $makensis /VERSION
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build App
        shell: bash
        run: |
          wails build \
            --platform windows/amd64 \
            -nsis \
            -o nephrite.exe

      - name: Upload App
        uses: actions/upload-artifact@v7
        with:
          name: nephrite.exe
          path: build/bin/nephrite.exe
          if-no-files-found: error

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: nephrite-amd64-installer.exe
          path: build/bin/nephrite-amd64-installer.exe
          if-no-files-found: error
